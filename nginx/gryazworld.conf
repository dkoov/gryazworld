# Этот файл — для установки на хост-машину, если nginx стоит НЕ в Docker
# Скопировать в /etc/nginx/sites-available/gryazworld.conf
# sudo ln -s /etc/nginx/sites-available/gryazworld.conf /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name gryazworld.ru www.gryazworld.ru;

    # Редирект на HTTPS (раскомментировать после получения SSL)
    # return 301 https://$host$request_uri;

    root /var/www/gryazworld/dist;
    index index.html;

    # Frontend — SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend
    location /web/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /mc/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000;
    }
}

