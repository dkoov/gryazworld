# SimpleProxyChat — GryazWorld
# Устанавливается на: Velocity
# helper.jar положить на каждый бэкенд

use-discord: true
bot-token: "ВСТАВИТЬ_TOKEN_БОТА"
channel-id: "ВСТАВИТЬ_ID_КАНАЛА"
chat-message: "[{server}] {prefix}{player}: {message}"
join-message: "✅ **{player}** зашёл на **{server}**"
leave-message: "❌ **{player}** вышел с сервера"
