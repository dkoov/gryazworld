services:
  discord-bot:
    build: ./discord-bot
    container_name: gryazworld-bot
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    env_file:
      - ./discord-bot/.env

  discord-bot-main:
    build: ./discord-bot-main
    container_name: ichorix-bot-main
    restart: unless-stopped
    volumes:
      - ./discord-bot-main/data:/app/data
    env_file:
      - ./discord-bot-main/.env

  discord-bot-auth:
    image: gryazworld-discord-bot-auth:latest
    container_name: ichorix-auth-bot
    restart: unless-stopped
    env_file:
      - ./discord-bot-auth/.env