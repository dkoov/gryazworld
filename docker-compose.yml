services:
  backend:
    build: ./backend
    container_name: gryazworld-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/serverpanel.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  discord-bot:
    build: ./discord-bot
    container_name: gryazworld-bot
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: gryazworld-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
